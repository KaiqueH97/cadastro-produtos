<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Login | Cadastro de Produtos</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="pagina-centralizada">
  <main class="cartao cartao-login">
    <div class="marca">CP</div>

    <h1>Cadastro de Produtos</h1>
    <p class="texto-secundario">
      Entre com sua conta para acessar o sistema.
    </p>

    <form id="formulario-login">
      <div class="campo">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          required
        >
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          autocomplete="current-password"
          required
        >
      </div>

      <button id="botao-entrar" type="submit">
        Entrar
      </button>

      <p
        id="mensagem-login"
        class="mensagem"
        role="alert"
        aria-live="polite"
      ></p>
    </form>
  </main>

  <script src="/js/login.js" defer></script>
</body>
</html>
