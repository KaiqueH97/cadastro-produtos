<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Produtos | Cadastro de Produtos</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecalho">
    <div>
      <strong>Cadastro de Produtos</strong>
      <span id="nome-usuario" class="usuario-logado"></span>
    </div>

    <button id="botao-sair" class="botao-secundario" type="button">
      Sair
    </button>
  </header>

  <main class="conteudo">
    <section class="cartao">
      <h1>Produtos</h1>
      <p class="texto-secundario">
        Login realizado com sucesso. A listagem será adicionada
        na próxima etapa.
      </p>
    </section>
  </main>

  <script src="/js/produtos.js" defer></script>
</body>
</html>
