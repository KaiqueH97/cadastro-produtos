<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Produtos | Cadastro de Produtos</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header class="cabecalho">
    <div>
      <strong>Cadastro de Produtos</strong>
      <span id="nome-usuario" class="usuario-logado"></span>
    </div>

    <button id="botao-sair" class="botao-secundario" type="button">
      Sair
    </button>
  </header>

  <main class="conteudo">
    <section class="cartao painel-produtos">
      <div class="titulo-painel">
        <div>
          <h1>Produtos</h1>
          <p class="texto-secundario">
            Consulte e cadastre os produtos do sistema.
          </p>
        </div>

        <button
          id="botao-novo-produto"
          class="botao-acao"
          type="button"
        >
          Novo produto
        </button>
      </div>

      <form id="formulario-produto" class="formulario-produto" hidden>
        <h2>Novo produto</h2>

        <div class="grade-formulario">
          <div class="campo">
            <label for="descricao">Descrição</label>
            <input
              type="text"
              id="descricao"
              maxlength="255"
              required
            >
          </div>

          <div class="campo">
            <label for="quantidade">Quantidade</label>
            <input
              type="number"
              id="quantidade"
              min="0"
              step="1"
              required
            >
          </div>

          <div class="campo">
            <label for="valor">Valor</label>
            <input
              type="number"
              id="valor"
              min="0"
              max="99999999.99"
              step="0.01"
              required
            >
          </div>
        </div>

        <p
          id="mensagem-formulario"
          class="mensagem"
          role="alert"
          aria-live="polite"
          hidden
        ></p>

        <div class="acoes-formulario">
          <button
            id="botao-cancelar"
            class="botao-cancelar"
            type="button"
          >
            Cancelar
          </button>

          <button id="botao-salvar" class="botao-acao" type="submit">
            Salvar produto
          </button>
        </div>
      </form>

      <p
        id="mensagem-listagem"
        class="mensagem-listagem"
        aria-live="polite"
      >
        Carregando produtos...
      </p>

      <div id="container-tabela" class="tabela-responsiva" hidden>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Data de cadastro</th>
              <th>Usuário</th>
              <th>Descrição</th>
              <th>Quantidade</th>
              <th>Valor</th>
            </tr>
          </thead>

          <tbody id="corpo-tabela-produtos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/produtos.js" defer></script>
</body>
</html>
